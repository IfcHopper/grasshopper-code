<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Bridge part: grey bridge with one deck segment highlighted. -->
  <defs>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8E8E8"/>
      <stop offset="1" stop-color="#9A9A9A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC4D2"/>
      <stop offset="1" stop-color="#2A9DAE"/>
    </linearGradient>
  </defs>

  <!-- Railing -->
  <path d="M2.5,5.5 H21.5 M4.5,5.5 V8 M8.5,5.5 V8 M12.5,5.5 V8 M16.5,5.5 V8 M20.5,5.5 V8" fill="none" stroke="#454545"/>

  <!-- Arch and piers -->
  <path d="M4.5,10.5 H19.5 V21.5 H17.5 A5.5,5.5 0 0 0 6.5,21.5 H4.5 Z" fill="url(#grey)" stroke="#454545" stroke-linejoin="round"/>

  <!-- Deck with highlighted segment -->
  <rect x="2.5" y="8.5" width="19" height="3" fill="url(#grey)" stroke="#454545"/>
  <rect x="8.5" y="7.5" width="7" height="5" fill="url(#amber)" stroke="#124A52"/>
</svg>
