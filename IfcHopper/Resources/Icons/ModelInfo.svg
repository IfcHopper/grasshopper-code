<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Model Info: IFC blue spatial tree, one node per level with counted children. -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7FD0"/>
      <stop offset="1" stop-color="#0E519C"/>
    </linearGradient>
  </defs>

  <!-- Branches -->
  <path d="M5.5,7 V18.5 H9 M5.5,11.5 H9" fill="none" stroke="#454545"/>

  <!-- Nodes -->
  <g fill="url(#blue)" stroke="#072D57">
    <rect x="2.5" y="2.5" width="6" height="4"/>
    <rect x="9.5" y="9.5" width="6" height="4"/>
    <rect x="9.5" y="16.5" width="6" height="4"/>
  </g>

  <!-- Text lines -->
  <g fill="#8DB8EA">
    <rect x="10" y="3" width="11" height="2"/>
    <rect x="17" y="10" width="4" height="2"/>
    <rect x="17" y="17" width="5" height="2"/>
  </g>
</svg>