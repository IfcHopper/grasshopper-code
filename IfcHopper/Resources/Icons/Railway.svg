<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Railway: track seen from above, sleepers under two rails. -->
  <defs>
    <linearGradient id="sleeper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC4D2"/>
      <stop offset="1" stop-color="#2A9DAE"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8E8E8"/>
      <stop offset="1" stop-color="#8A8A8A"/>
    </linearGradient>
  </defs>

  <!-- Sleepers -->
  <g fill="url(#sleeper)" stroke="#124A52">
    <rect x="4.5" y="3.5" width="15" height="2"/>
    <rect x="4.5" y="8.5" width="15" height="2"/>
    <rect x="4.5" y="13.5" width="15" height="2"/>
    <rect x="4.5" y="18.5" width="15" height="2"/>
  </g>

  <!-- Rails -->
  <g fill="url(#rail)" stroke="#454545">
    <rect x="7.5" y="2.5" width="2" height="19"/>
    <rect x="14.5" y="2.5" width="2" height="19"/>
  </g>
</svg>
