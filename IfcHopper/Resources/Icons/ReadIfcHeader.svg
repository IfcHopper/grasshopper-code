<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Read IFC Header: document with IFC blue header band, arrow leaving the header. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5C5C5"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0E0E0"/>
      <stop offset="1" stop-color="#9A9A9A"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D7FD0"/>
      <stop offset="1" stop-color="#0E519C"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D7FD0"/>
      <stop offset="1" stop-color="#0E519C"/>
    </linearGradient>
  </defs>

  <!-- Document -->
  <path d="M3.5,2.5 H11.5 L15.5,6.5 V21.5 H3.5 Z" fill="url(#paper)" stroke="#454545" stroke-linejoin="round"/>
  <path d="M11.5,2.5 V6.5 H15.5 Z" fill="url(#fold)" stroke="#454545" stroke-linejoin="round"/>

  <!-- Header band -->
  <rect x="4" y="8" width="11" height="3" fill="url(#blue)"/>
  <rect x="5" y="9" width="5" height="1" fill="#FFFFFF"/>

  <!-- Body text lines -->
  <rect x="5" y="13" width="9" height="1" fill="#8C8C8C"/>
  <rect x="5" y="15" width="7" height="1" fill="#8C8C8C"/>
  <rect x="5" y="17" width="9" height="1" fill="#8C8C8C"/>
  <rect x="5" y="19" width="6" height="1" fill="#8C8C8C"/>

  <!-- Arrow out of the header -->
  <path d="M13.5,8.5 H17.5 V6.5 L20.5,9.5 L17.5,12.5 V10.5 H13.5 Z" fill="url(#amber)" stroke="#072D57" stroke-linejoin="round"/>
  <rect x="14" y="9" width="1" height="1" fill="#FFFFFF"/>
</svg>
