<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Space: a room, two walls standing on a floor plate. -->
  <defs>
    <linearGradient id="wallLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C8C8C8"/>
    </linearGradient>
    <linearGradient id="wallDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9D9D9"/>
      <stop offset="1" stop-color="#9A9A9A"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4D2"/>
      <stop offset="1" stop-color="#2A9DAE"/>
    </linearGradient>
  </defs>

  <!-- Back walls first, the floor plate overlaps their feet -->
  <path d="M3.5,14.5 L11.5,10.5 L11.5,3.5 L3.5,7.5 Z" fill="url(#wallLight)" stroke="#454545" stroke-linejoin="round"/>
  <path d="M11.5,10.5 L19.5,14.5 L19.5,7.5 L11.5,3.5 Z" fill="url(#wallDark)" stroke="#454545" stroke-linejoin="round"/>
  <path d="M3.5,14.5 L11.5,10.5 L19.5,14.5 V15.5 L11.5,19.5 L3.5,15.5 Z" fill="url(#floor)" stroke="#124A52" stroke-linejoin="round"/>
</svg>
