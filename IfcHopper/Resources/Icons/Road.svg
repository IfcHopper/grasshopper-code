<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Road: asphalt strip seen from above with dashed centre line. -->
  <defs>
    <linearGradient id="asphalt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E6E6E"/>
      <stop offset="1" stop-color="#454545"/>
    </linearGradient>
  </defs>

  <rect x="5.5" y="2.5" width="13" height="19" fill="url(#asphalt)" stroke="#191919"/>

  <!-- Edge lines -->
  <rect x="7" y="3" width="1" height="18" fill="#C5C5C5"/>
  <rect x="16" y="3" width="1" height="18" fill="#C5C5C5"/>

  <!-- Centre dashes, placed pixel by pixel -->
  <g fill="#5CC4D2">
    <rect x="11" y="3" width="2" height="3"/>
    <rect x="11" y="8" width="2" height="3"/>
    <rect x="11" y="13" width="2" height="3"/>
    <rect x="11" y="18" width="2" height="3"/>
  </g>
</svg>
