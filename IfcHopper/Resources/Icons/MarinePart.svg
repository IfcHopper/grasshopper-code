<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Marine part: grey quay with one section highlighted, above water waves. -->
  <defs>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8E8E8"/>
      <stop offset="1" stop-color="#9A9A9A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC4D2"/>
      <stop offset="1" stop-color="#2A9DAE"/>
    </linearGradient>
  </defs>

  <!-- Bollard -->
  <rect x="4.5" y="3.5" width="4" height="2" fill="url(#grey)" stroke="#454545"/>
  <rect x="5.5" y="5.5" width="2" height="2" fill="url(#grey)" stroke="#454545"/>

  <!-- Quay with highlighted section -->
  <rect x="2.5" y="7.5" width="19" height="6" fill="url(#grey)" stroke="#454545"/>
  <rect x="12.5" y="7.5" width="9" height="6" fill="url(#amber)" stroke="#124A52"/>

  <!-- Waves -->
  <path d="M2.5,17.5 L4.5,15.5 L6.5,17.5 L8.5,15.5 L10.5,17.5 L12.5,15.5 L14.5,17.5 L16.5,15.5 L18.5,17.5 L20.5,15.5 L21.5,16.5" fill="none" stroke="#2A9DAE" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M2.5,21.5 L4.5,19.5 L6.5,21.5 L8.5,19.5 L10.5,21.5 L12.5,19.5 L14.5,21.5 L16.5,19.5 L18.5,21.5 L20.5,19.5 L21.5,20.5" fill="none" stroke="#0E519C" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
