<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Road part: grey road with one segment highlighted. -->
  <defs>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8E8E8"/>
      <stop offset="1" stop-color="#9A9A9A"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC4D2"/>
      <stop offset="1" stop-color="#2A9DAE"/>
    </linearGradient>
  </defs>

  <rect x="5.5" y="2.5" width="13" height="19" fill="url(#grey)" stroke="#454545"/>
  <rect x="5.5" y="8.5" width="13" height="7" fill="url(#amber)" stroke="#124A52"/>

  <!-- Edge lines and centre dashes -->
  <g fill="#FFFFFF">
    <rect x="7" y="3" width="1" height="18"/>
    <rect x="16" y="3" width="1" height="18"/>
    <rect x="11" y="3" width="2" height="3"/>
    <rect x="11" y="10" width="2" height="4"/>
    <rect x="11" y="18" width="2" height="3"/>
  </g>
</svg>
