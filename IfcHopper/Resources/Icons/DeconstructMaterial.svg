<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Deconstruct Material: Material glyph (three layers, the middle one hatched) scaled down above, parts below. -->
  <g transform="translate(4.8,1) scale(0.6)">
    <defs>
      <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5CC4D2"/>
        <stop offset="1" stop-color="#2A9DAE"/>
      </linearGradient>
    </defs>

    <rect x="3.5" y="3.5" width="17" height="17" fill="url(#amber)" stroke="#124A52"/>
    <rect x="4" y="4" width="16" height="1" fill="#A6E0E8"/>
    <path d="M4,8.5 H20 M4,15.5 H20" stroke="#124A52"/>
    <path d="M4.5,14.5 L9.5,9.5 M9.5,14.5 L14.5,9.5 M14.5,14.5 L19.5,9.5" stroke="#1C6C79"/>
  </g>

  <!-- Parts below, linked by pixel dashes -->
  <defs>
    <linearGradient id="partAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5CC4D2"/>
      <stop offset="1" stop-color="#2A9DAE"/>
    </linearGradient>
  </defs>
  <g fill="#454545">
    <rect x="6" y="15" width="1" height="1"/>
    <rect x="8" y="15" width="1" height="1"/>
    <rect x="10" y="15" width="1" height="1"/>
    <rect x="12" y="15" width="1" height="1"/>
    <rect x="14" y="15" width="1" height="1"/>
    <rect x="16" y="15" width="1" height="1"/>
    <rect x="18" y="15" width="1" height="1"/>
  </g>
  <g fill="url(#partAmber)" stroke="#124A52">
    <rect x="4.5" y="17.5" width="4" height="4"/>
    <rect x="10.5" y="17.5" width="4" height="4"/>
    <rect x="16.5" y="17.5" width="4" height="4"/>
  </g>
</svg>
