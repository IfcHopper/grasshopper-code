    </defs>
  
    <path d="M3.5,16.5 L11.5,12.5 L19.5,16.5 V17.5 L11.5,21.5 L3.5,17.5 Z" fill="url(#grey)" stroke="#454545" stroke-linejoin="round"/>
    <path d="M3.5,11.5 L11.5,7.5 L19.5,11.5 V12.5 L11.5,16.5 L3.5,12.5 Z" fill="url(#amber)" stroke="#124A52" stroke-linejoin="round"/>
