<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Context: world coordinate plane with origin, vertical axis and true north arrow. -->
  <defs>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8D8D8"/>
      <stop offset="1" stop-color="#8A8A8A"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2626B"/>
      <stop offset="1" stop-color="#DE2633"/>
    </linearGradient>
  </defs>

  <!-- Plane -->
  <path d="M2.5,19.5 L8.5,13.5 H21.5 L15.5,19.5 Z" fill="url(#plane)" stroke="#454545" stroke-linejoin="round"/>

  <!-- Vertical axis -->
  <path d="M11.5,16 V4.5 M9.5,6.5 L11.5,4.5 L13.5,6.5" fill="none" stroke="#454545" stroke-linejoin="round"/>

  <!-- True north arrow -->
  <path d="M12,16.5 L16.5,12" fill="none" stroke="#6E0A12" stroke-width="3" stroke-linecap="round"/>
  <path d="M12,16.5 L16.5,12" fill="none" stroke="#DE2633" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M19.5,9.5 H14.5 L19.5,14.5 Z" fill="url(#red)" stroke="#6E0A12" stroke-linejoin="round"/>

  <!-- Origin -->
  <rect x="11" y="16" width="2" height="2" fill="#FFFFFF"/>
</svg>
