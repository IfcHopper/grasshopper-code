    <rect x="3" y="10" width="17" height="1" fill="#8DB8EA"/>
  </g>

  <!-- Pencil: edit -->
  <defs>
    <linearGradient id="pencilAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D7FD0"/>
      <stop offset="1" stop-color="#0E519C"/>
    </linearGradient>
  </defs>
  <path d="M19.5,10.5 L21.5,12.5 L14.5,19.5 L12.5,17.5 Z" fill="url(#pencilAmber)" stroke="#072D57" stroke-linejoin="round"/>
  <path d="M12.5,17.5 L14.5,19.5 L11.5,20.5 Z" fill="#F0D8A8" stroke="#072D57" stroke-linejoin="round"/>
  <rect x="11" y="20" width="1" height="1" fill="#191919"/>
