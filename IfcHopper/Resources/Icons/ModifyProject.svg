<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Modify Project: Project icon scaled down, with a pencil. -->
  <g transform="translate(1.5,1.5) scale(0.6)">
    <defs>
      <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#2668B8"/>
        <stop offset="1" stop-color="#0B4483"/>
      </linearGradient>
      <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3D7FD0"/>
        <stop offset="1" stop-color="#0E519C"/>
