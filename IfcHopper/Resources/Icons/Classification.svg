<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Classification: IFC purple tag with a hole and code lines, a classification reference. -->
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C468B3"/>
      <stop offset="1" stop-color="#9A3B89"/>
    </linearGradient>
  </defs>

  <!-- Tag -->
  <path d="M2.5,11.5 L7.5,6.5 H21.5 V16.5 H7.5 Z" fill="url(#purple)" stroke="#4D1C44" stroke-linejoin="round"/>
  <path d="M4,11.5 L8,7.5 H21" fill="none" stroke="#E3A6D6"/>

  <!-- Hole -->
  <rect x="5.5" y="10.5" width="2" height="2" fill="#FFFFFF" stroke="#4D1C44"/>

  <!-- Code lines -->
  <g fill="#FFFFFF">
    <rect x="10" y="9" width="9" height="1"/>
    <rect x="10" y="11" width="6" height="1"/>
    <rect x="10" y="13" width="8" height="1"/>
  </g>
</svg>
