<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Deconstruct Pset: Pset glyph (blue list) scaled down above, parts below. -->
  <g transform="translate(4.8,1) scale(0.6)">
    <defs>
      <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#3D7FD0"/>
        <stop offset="1" stop-color="#0E519C"/>
      </linearGradient>
    </defs>

    <g fill="url(#blue)" stroke="#072D57">
      <rect x="3.5" y="3.5" width="4" height="4"/>
      <rect x="3.5" y="10.5" width="4" height="4"/>
      <rect x="3.5" y="17.5" width="4" height="4"/>
      <rect x="9.5" y="4.5" width="11" height="2"/>
      <rect x="9.5" y="11.5" width="11" height="2"/>
      <rect x="9.5" y="18.5" width="7" height="2"/>
    </g>
  </g>

    <!-- Parts below, linked by pixel dashes -->
  <defs>
    <linearGradient id="partAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D7FD0"/>
      <stop offset="1" stop-color="#0E519C"/>
    </linearGradient>
  </defs>
  <g fill="#454545">
    <rect x="6" y="15" width="1" height="1"/>
    <rect x="8" y="15" width="1" height="1"/>
    <rect x="10" y="15" width="1" height="1"/>
    <rect x="12" y="15" width="1" height="1"/>
    <rect x="14" y="15" width="1" height="1"/>
    <rect x="16" y="15" width="1" height="1"/>
    <rect x="18" y="15" width="1" height="1"/>
  </g>
  <g fill="url(#partAmber)" stroke="#072D57">
    <rect x="4.5" y="17.5" width="4" height="4"/>
    <rect x="10.5" y="17.5" width="4" height="4"/>
    <rect x="16.5" y="17.5" width="4" height="4"/>
  </g>
</svg>
