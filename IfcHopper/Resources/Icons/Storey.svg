<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Storey: three stacked floor plates, the middle one highlighted. -->
  <defs>
    <linearGradient id="grey" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#B5B5B5"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CC4D2"/>
      <stop offset="1" stop-color="#2A9DAE"/>
    </linearGradient>
  </defs>

  <!-- Drawn bottom to top so upper plates overlap lower ones -->
  <path d="M3.5,16.5 L11.5,12.5 L19.5,16.5 V17.5 L11.5,21.5 L3.5,17.5 Z" fill="url(#grey)" stroke="#454545" stroke-linejoin="round"/>
  <path d="M3.5,11.5 L11.5,7.5 L19.5,11.5 V12.5 L11.5,16.5 L3.5,12.5 Z" fill="url(#amber)" stroke="#124A52" stroke-linejoin="round"/>
  <path d="M3.5,6.5 L11.5,2.5 L19.5,6.5 V7.5 L11.5,11.5 L3.5,7.5 Z" fill="url(#grey)" stroke="#454545" stroke-linejoin="round"/>
</svg>
